<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <div class="titulo_cabecalho">TechVanguard</div>
        <nav class="menu">
            <a href="index.html" target="_blank">Home</a>
            <a href="sobrenos.html" target="_blank">Sobre Nós</a>
            <a href="" target="_blank">Fale Conosco</a>
            <a href="servico.html" target="_blank">Serviços</a>
        </nav>
    </header>

     <main class="corpo">
        <h1 class="acolhimento2">PREENCHA O FORMULÁRIO</h1>
        <p class="subititulo2">E aguarde o contato</P>

        <div class="area-inscrição">

            <form action="/processar cadastro" method="post" class="coluna-form"> 
                
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required minlength="3" maxlength="50"> <br>

                <label for="cpf">CPF</label>
                <input type="text" name="cpf" id="cpf" placeholder="Digite seu CPF" required minlength="11"       maxlength="14"><br>

                <label for="e-mail">E-mail:</label>
                <input type="email" id="email" name="email"  placeholder="exemplo@dominio.com" required><br><br>

                <label for="data_nasc">Data de Nascimento:</label>
                <input type="date" id="data_nasc" name="data_nascimento" min="1900-01-01"  max="2026-12-31" required><br><br>

                <label >Qual o motivo do contato</label><br>

                <select name="motivo" id="motivo" required>
                    <option value=""disa select>Slecione o Motivo</option>
                    <option value="orcamento">Orçamento</option>
                    <option value="suporte">Suporte</option>
                    <option value="especialistas">Conversar com especialistas</option>
                    <option value="opiton_outros">Outros</option>
                </select><br>

                <label for="outros">Outros</label>
                <input type="text" id="outros" name="outros" placeholder="Digite os motivos" required minlength="3" maxlength="50"> <br><br>

                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Li e aceito os Termos</label><br><br>

                <button type="submit" class="btn-enviar"> Enviar </button>
                <button type="reset" class="btn-limpar"> Limpar Tudo </button>

            </form>

            
                <img class="poster4" src="atendimento.jpg" alt="atendimento_tec">

        </div>
    
    </main>


            <footer class="roda_pe">
            <p>
                TechVanguard
            </p>
        </footer>

</body>
</html>
